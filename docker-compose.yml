version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: invoice-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: invoice_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
